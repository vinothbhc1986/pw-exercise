<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drag & Drop</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    min-height: 100vh;
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #f0f2f5;
  }
  .box {
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 600;
    transition: all 0.2s;
    user-select: none;
  }
  #dragBox {
    background: #4f46e5;
    color: #fff;
    cursor: grab;
  }
  #dragBox:active { cursor: grabbing; }
  #dropBox {
    background: #fff;
    border: 3px dashed #4f46e5;
    color: #4f46e5;
  }
  #dropBox.drag-over {
    background: #eef2ff;
    border-color: #6366f1;
    transform: scale(1.05);
  }
  #dropBox.dropped {
    background: #4f46e5;
    color: #fff;
    border-style: solid;
  }
</style>
</head>
<body>

<div id="dragBox" class="box" draggable="true"></div>
<div id="dropBox" class="box"></div>

<script>
  const drag = document.getElementById('dragBox');
  const drop = document.getElementById('dropBox');

  drag.addEventListener('dragstart', () => {
    drag.style.opacity = '0.5';
  });

  drag.addEventListener('dragend', () => {
    drag.style.opacity = '1';
  });

  drop.addEventListener('dragover', (e) => {
    e.preventDefault();
    drop.classList.add('drag-over');
  });

  drop.addEventListener('dragleave', () => {
    drop.classList.remove('drag-over');
  });

  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('drag-over');
  //  drop.classList.add('dropped');
    drop.textContent = 'Dropped!';
    drag.textContent = 'Dragged';
    drag.style.opacity = '1';
  });
</script>

</body>
</html>
